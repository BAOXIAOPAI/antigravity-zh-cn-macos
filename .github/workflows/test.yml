name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: zsh -n 启动中文适配.command 恢复英文.command scripts/launcher.zsh
      - run: npm run package
