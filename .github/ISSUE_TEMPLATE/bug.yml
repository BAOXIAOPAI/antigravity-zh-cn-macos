name: 运行或兼容性问题
description: 连接失败、无法恢复或其他运行问题
title: "[问题] "
body:
  - type: input
    id: environment
    attributes:
      label: Antigravity / macOS / Node.js 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期与实际结果
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 错误信息（可选）
      description: 只提供与适配器有关的错误，请勿粘贴令牌、账户信息或完整私人日志。
